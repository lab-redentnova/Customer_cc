name: Generate PDF and send email

on:
  repository_dispatch:
    types: [complaint_submitted]

permissions:
  contents: write

concurrency:
  group: send-${{ github.event.client_payload.submission_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, windows, dropbox]
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      

      - name: Verify system Python
        shell: pwsh
        run: |
          python --version
          where python


      # Optional but helps speed up subsequent runs
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import sys; print(sys.executable); print(sys.version)"

      - name: Execute pipeline
        shell: pwsh
        env:
          SEND_EMAIL: ${{ vars.SEND_EMAIL }}
          SEND_TO_CUSTOMER: ${{ vars.SEND_TO_CUSTOMER }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USE_STARTTLS: ${{ secrets.SMTP_USE_STARTTLS }}

          LAB_EMAIL: ${{ secrets.LAB_EMAIL }}

          # Nice-to-have in your metadata
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python app/main.py

          # Fail if no PDF was generated
          if (-not (Test-Path "out")) { throw "out/ folder not found" }
          $pdfs = Get-ChildItem -Path "out" -Filter *.pdf -ErrorAction SilentlyContinue
          if ($null -eq $pdfs -or $pdfs.Count -lt 1) { throw "No PDF generated in out/*.pdf" }

      - name: Upload generated PDF (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: complaint-pdf
          path: out/*.pdf
          if-no-files-found: error

      - name: Copy PDF to Dropbox Team Shared folder
        shell: pwsh
        env:
          DROPBOX_TARGET: ${{ vars.DROPBOX_TARGET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DROPBOX_TARGET)) {
            throw "DROPBOX_TARGET GitHub Variable is not set"
          }
          if (!(Test-Path $env:DROPBOX_TARGET)) {
            throw "Dropbox target folder not found: $env:DROPBOX_TARGET"
          }

          $src = Get-ChildItem -Path "out" -Filter *.pdf
          Copy-Item $src.FullName $env:DROPBOX_TARGET -Force

          Write-Host "Copied PDF(s) to Dropbox target: $env:DROPBOX_TARGET"
          Get-ChildItem $env:DROPBOX_TARGET | Sort-Object LastWriteTime -Descending | Select-Object -First 5 | Format-Table

      - name: Commit metadata CSV
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Add only the metadata file; ignore if it doesn't exist yet
          if (Test-Path "data/complaints_metadata.csv") {
            git add data/complaints_metadata.csv
          } else {
            Write-Host "No data/complaints_metadata.csv found to commit (skipping)."
            exit 0
          }

          # Commit only if there are changes
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No metadata changes to commit."
            exit 0
          }

          git commit -m "Append complaint metadata (CSV)"
          git push
