name: Generate PDF and send email

on:
  repository_dispatch:
    types: [complaint_submitted]

permissions:
  contents: write

concurrency:
  group: send-${{ github.event.client_payload.submission_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, windows, dropbox]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import sys; print(sys.executable); print(sys.version)"
          


      - name: Sync with latest main
        run: |
          git pull --rebase

      - name: Execute pipeline
        env:
          SEND_EMAIL: ${{ vars.SEND_EMAIL }}
          SEND_TO_CUSTOMER: ${{ vars.SEND_TO_CUSTOMER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_USE_STARTTLS: ${{ secrets.SMTP_USE_STARTTLS }}
      
          LAB_EMAIL: ${{ secrets.LAB_EMAIL }}
      
          
      
        run: |
          set -euxo pipefail
          pwd
          ls -la
        
          echo "=== running app.main ==="
          python -m app.main
        
          echo "=== after app.main ==="
          echo "=== out folder ==="
          find . -maxdepth 2 -type d -print
          ls -la out || true
          find out -maxdepth 1 -type f -print || true
        
          echo "=== data folder ==="
          ls -la data || true
        
          # fail if no pdf was generated
          test -n "$(ls -1 out/*.pdf 2>/dev/null | head -n 1)"
        
              

      - name: Upload generated PDF (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdf
          path: out/*.pdf
          if-no-files-found: error


      - name: Upload generated PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: complaint-pdf
          path: out/*.pdf

      - name: Commit metadata CSV
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/complaints_metadata.csv || true
          git diff --cached --quiet || git commit -m "Append complaint metadata (CSV)"
          git push
